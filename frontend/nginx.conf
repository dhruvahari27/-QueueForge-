# conf.d is loaded inside nginx's http block. Limit bursts per client IP as a
# basic edge guard; production deployments should also apply an API-key-aware
# distributed limiter at a trusted ingress.
limit_req_zone $binary_remote_addr zone=queueforge_api:10m rate=15r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 72k;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    limit_req zone=queueforge_api burst=40 nodelay;
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location = /api {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
  }
  location /docs { proxy_pass http://api:8000/docs; proxy_set_header Host $host; }
  location /openapi.json { proxy_pass http://api:8000/openapi.json; proxy_set_header Host $host; }
}
