databases:
  - name: queueforge-db
    databaseName: queueforge
    user: queueforge
    plan: free

services:
  - type: web
    name: queueforge-nexus
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueforge-db
          property: connectionString
      - key: APP_ENV
        value: development
      - key: MODE
        value: all
