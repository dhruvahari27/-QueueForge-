services:
  - type: web
    name: queueforge-nexus
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: development
      - key: MODE
        value: all
      - key: DATABASE_URL
        value: sqlite:///./queueforge.db
      - key: AUTO_CREATE_SCHEMA
        value: "true"
