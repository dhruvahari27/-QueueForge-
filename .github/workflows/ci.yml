name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queueforge
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: queueforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueforge -d queueforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://queueforge:ci-test-password@localhost:5432/queueforge_test
      AUTH_ENABLED: 'false'
      AUTO_CREATE_SCHEMA: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate migrations against PostgreSQL
        run: alembic upgrade head
      - name: Lint critical Python errors
        run: ruff check app tests scripts --select E9,F63,F7,F82
      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Security static analysis
        run: bandit -q -r app scripts
      - name: Validate Compose configuration
        working-directory: .
        run: docker compose config --quiet
      - name: Build containers
        working-directory: .
        run: docker compose build
